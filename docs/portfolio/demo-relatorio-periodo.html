<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório de vendas — demo portfólio</title>
  <style>
    body { font-family: Helvetica, Arial, sans-serif; color: #333; font-size: 12px; margin: 24px; }
    h1 { color: #2c3e50; font-size: 22px; }
    .kpis { display: flex; gap: 16px; margin: 20px 0; }
    .kpi { background: #ecf0f1; padding: 16px 24px; border-radius: 8px; flex: 1; text-align: center; }
    .kpi strong { display: block; font-size: 20px; color: #2c3e50; }
    .chart { height: 180px; background: linear-gradient(180deg, #3498db33 0%, transparent 100%); border: 1px solid #ddd; border-radius: 8px; margin-top: 16px; display: flex; align-items: flex-end; padding: 12px; gap: 8px; }
    .bar { flex: 1; background: #3498db; border-radius: 4px 4px 0 0; }
    footer { margin-top: 32px; font-size: 10px; color: #95a5a6; }
  </style>
</head>
<body>
  <h1>Relatório de vendas — Novembro/2025 (demo)</h1>
  <p>Dados fictícios · DistribIndustrial e outros clientes simulados</p>
  <div class="kpis">
    <div class="kpi"><span>Total vendas</span><strong>R$ 1.842.390</strong></div>
    <div class="kpi"><span>Meta mensal</span><strong>78%</strong></div>
    <div class="kpi"><span>YoY</span><strong>+11,2%</strong></div>
  </div>
  <div class="chart">
    <div class="bar" style="height:45%"></div>
    <div class="bar" style="height:62%"></div>
    <div class="bar" style="height:55%"></div>
    <div class="bar" style="height:80%"></div>
    <div class="bar" style="height:70%"></div>
  </div>
  <footer>Demo portfólio — sales-report-generator</footer>
</body>
</html>
